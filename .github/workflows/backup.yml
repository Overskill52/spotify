name: Spotify Playlist Backup

on:
  schedule:
    # Ежедневно в 04:00 UTC (07:00 MSK)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-backup-workflow
  cancel-in-progress: false

jobs:
  backup:
    name: Backup Playlist to CSV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and backup Spotify playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID || secrets.CLIENTID || secrets.CLIENDID || secrets.CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET || secrets.CLIENTSECRET || secrets.CLIENT_SECRET }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID || secrets.PLAYLISTID || secrets.PLAYLIST_ID }}
        run: |
          python backup.py

      - name: Commit and push if changes detected
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/playlist.csv

          if git diff --staged --quiet; then
            echo "Плейлист не изменился. Изменений для коммита нет."
          else
            echo "Обнаружены изменения в плейлисте. Создание коммита..."
            git commit -m "chore(backup): update Spotify playlist [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
